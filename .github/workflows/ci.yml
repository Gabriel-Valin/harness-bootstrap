name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The spec requires the skill folder name to match its name.
          path: harness-bootstrap

      - name: Validate skills against the Agent Skills spec
        working-directory: harness-bootstrap
        run: |
          pipx run --spec skills-ref agentskills validate "$PWD"
          for skill in assets/project/.agents/skills/*/; do
            pipx run --spec skills-ref agentskills validate "$skill"
          done

      - name: Shellcheck
        working-directory: harness-bootstrap
        run: |
          shellcheck scripts/*.sh tests/*.sh assets/adapters/claude-code/files/.claude/hooks/*.sh
          (cd assets/project/scripts/harness && shellcheck -x ./*.sh)

      - name: End-to-end
        working-directory: harness-bootstrap
        run: bash tests/e2e.sh

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: npx skills discovers exactly this skill
        working-directory: harness-bootstrap
        run: |
          npx -y skills@latest add "$PWD" --list 2>&1 | tee skills.log
          # The CLI colors its output even without a TTY; strip ANSI codes before matching.
          sed 's/\x1b\[[0-9;]*[A-Za-z]//g' skills.log | grep -q "Found 1 skill"
